<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖形摺摺看</title>
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:var(--ink);font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;line-height:1.6}
.app{max-width:980px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:28px;margin:8px 0 16px;color:#1d4ed8}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;cursor:pointer}
.tab{padding:10px 22px;border-radius:999px;border:1px solid #d1d5db;background:#fff;color:#4b5563;font-weight:700;font-size:17px}
.tab.on{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:20px}
.card[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:10px;border:0;background:#f3f4f6;color:#374151;font-weight:600}
.chip:hover{background:#fce7f3}
.chip.on{background:#ec4899;color:#fff}
.chips.blue .chip:hover{background:#dbeafe}
.chips.blue .chip.on{background:#2563eb}
.row-label{font-size:14px;color:var(--muted);margin:0 0 4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media(max-width:780px){.layout{grid-template-columns:1fr}}
.stage{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:14px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.legend i.dash{width:22px;height:0;border-top:3px dashed #ef4444;border-radius:0;vertical-align:4px}
.panel{display:flex;flex-direction:column;gap:14px}
.panel label{display:block;font-weight:700;font-size:15px}
.panel label b{color:var(--accent);margin-left:6px}
input[type=range]{width:100%;margin:6px 0 0;accent-color:#2563eb;height:28px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid #d1d5db;background:#fff;font-weight:700;color:#374151}
.btn:hover{background:#f9fafb}
.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.primary:hover{background:#1d4ed8}
.tips{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;font-size:15px;color:#1e3a8a}
.tips p{margin:0 0 6px;font-weight:700}
.tips ol{margin:0;padding-left:20px}
.out{min-height:84px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:16px;color:#78350f}
.out div+div{margin-top:4px}
.hit{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <h1>圖形摺摺看</h1>

  <div class="tabs">
    <button class="tab on" data-tab="1">任務一：自由摺摺看</button>
    <button class="tab" data-tab="2">任務二：標記一個點，看它摺到哪裡</button>
  </div>

  <!-- 任務一 -->
  <section id="p1" class="card">
    <div class="row-label">選一個圖形</div>
    <div class="chips" id="shapeChips"></div>
    <div class="layout">
      <div>
        <svg id="svg1" class="stage" viewBox="-70 -70 540 540" role="img" aria-label="可以摺的圖形"></svg>
        <div class="legend">
          <span><i style="background:#f472b6"></i>不動的那一半</span>
          <span><i style="background:#60a5fa"></i>被摺過去的那一半</span>
          <span><i class="dash"></i>摺痕</span>
        </div>
      </div>
      <div class="panel">
        <label>摺痕的方向<b id="v1theta"></b>
          <input id="r1theta" type="range" min="0" max="175" step="5" value="0"></label>
        <label>摺痕的位置
          <input id="r1off" type="range" min="-150" max="150" step="5" value="0"></label>
        <label>摺起來的程度
          <input id="r1p" type="range" min="0" max="100" step="1" value="0"></label>
        <div class="btns">
          <button id="b1fold" class="btn primary">對摺</button>
          <button id="b1side" class="btn">換另一半來摺</button>
          <button id="b1reset" class="btn">全部重來</button>
        </div>
        <div class="tips">
          <p>試試看</p>
          <ol>
            <li>轉動摺痕、移動摺痕，再按「對摺」。</li>
            <li>摺起來以後，粉紅色和藍色有沒有完全疊在一起？沒有的話，哪裡露出來？</li>
            <li>換一個圖形再試。每個圖形能完全疊在一起的摺法一樣多嗎？</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <!-- 任務二 -->
  <section id="p2" class="card" hidden>
    <div class="row-label">選一個圖形</div>
    <div class="chips" id="figChips"></div>
    <div class="layout">
      <div>
        <svg id="svg2" class="stage" viewBox="-70 -70 540 540" role="img" aria-label="可以標記的圖形"></svg>
        <div class="legend">
          <span><i style="background:#f472b6"></i>不動的那一半</span>
          <span><i style="background:#60a5fa"></i>被摺過去的那一半</span>
          <span><i style="background:#f59e0b"></i>你標記的</span>
          <span><i class="dash"></i>摺痕</span>
        </div>
      </div>
      <div class="panel">
        <div>
          <div class="row-label">摺的方向</div>
          <div class="chips blue" id="dirChips" style="margin:0"></div>
        </div>
        <div>
          <div class="row-label">要標記什麼</div>
          <div class="chips blue" id="modeChips" style="margin:0"></div>
        </div>
        <label>摺起來的程度
          <input id="r2p" type="range" min="0" max="100" step="1" value="0"></label>
        <div class="btns">
          <button id="b2fold" class="btn primary">對摺</button>
          <button id="b2side" class="btn">換另一半來摺</button>
          <button id="b2clear" class="btn">清除標記</button>
        </div>
        <div class="out" id="out2"></div>
        <div class="tips">
          <p>試試看</p>
          <ol>
            <li>點圖上的點（或邊）做記號，可以標記很多個。</li>
            <li>按「對摺」，看看被標記的地方會跑到哪裡。</li>
            <li>換不同的圖形、不同的摺法，結果一樣嗎？</li>
          </ol>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const PINK = ['#f472b6', '#be185d'];   // 不動的那一半 (填色, 邊線)
const BLUE = ['#60a5fa', '#1d4ed8'];   // 被摺過去的那一半

/* ---------- 任務一的圖形 ---------- */
const SHAPES = [
  { name: '愛心', cx: 200, cy: 190, d: 'M 200 100 C 200 100 170 50 120 50 C 60 50 40 110 40 150 C 40 220 120 280 200 330 C 280 280 360 220 360 150 C 360 110 340 50 280 50 C 230 50 200 100 200 100 Z' },
  { name: '等腰三角形', cx: 200, cy: 207, d: 'M 200 60 L 320 280 L 80 280 Z' },
  { name: '正三角形', cx: 200, cy: 200, d: 'M 200 60 L 321.24 270 L 78.76 270 Z' },
  { name: '菱形', cx: 200, cy: 200, d: 'M 200 60 L 320 200 L 200 340 L 80 200 Z' },
  { name: '等腰梯形', cx: 200, cy: 180, d: 'M 140 100 L 260 100 L 320 260 L 80 260 Z' },
  { name: '正方形', cx: 200, cy: 200, d: 'M 100 100 L 300 100 L 300 300 L 100 300 Z' },
  { name: '長方形', cx: 200, cy: 200, d: 'M 80 120 L 320 120 L 320 280 L 80 280 Z' },
  { name: '圓形', cx: 200, cy: 200, circle: true },
  { name: '平行四邊形', cx: 200, cy: 180, d: 'M 120 100 L 320 100 L 280 260 L 80 260 Z' }
];

/* ---------- 任務二的圖形（點與邊由頂點順序自動產生）---------- */
const FIGS = [
  {
    name: '長方形', cx: 200, cy: 200,
    pts: {
      v: [['A',80,100],['B',200,100],['C',320,100],['D',320,300],['E',200,300],['F',80,300]],
      h: [['A',100,80],['B',300,80],['C',300,200],['D',300,320],['E',100,320],['F',100,200]]
    }
  },
  {
    name: '平行四邊形', cx: 200, cy: 180,
    pts: {
      v: [['A',120,100],['B',320,100],['C',280,260],['D',80,260]],
      h: [['A',120,100],['B',320,100],['C',280,260],['D',80,260]]
    }
  }
];

const state = {
  tab: 1,
  t1: { shape: 0, theta: 0, off: 0, side: 1, p: 0 },
  t2: { fig: 0, dir: 'v', mode: 'points', side: 1, p: 0, marked: new Set() }
};

/* ---------- 共用：畫出摺紙畫面 ----------
   座標轉換：以 (cx,cy) 為原點、旋轉 theta 之後，摺痕就是 x = off 的直線。
   side=1：x > off 的那一半被摺過去；side=-1 則相反。
   p 從 0 到 1：把被摺的那一半沿 x 方向縮放 (1-2p)，p=1 時剛好是鏡射。 */
function shapeMarkup(sh, c) {
  const a = `fill="${c[0]}" fill-opacity="0.55" stroke="${c[1]}" stroke-width="3" stroke-linejoin="round"`;
  return sh.circle ? `<circle cx="200" cy="200" r="120" ${a}/>` : `<path d="${sh.d}" ${a}/>`;
}

function scene(o) {
  const { id, cx, cy, theta, off, side, p } = o;
  const T = `translate(${cx} ${cy}) rotate(${theta})`;
  const mvX = side === 1 ? off : off - 2000;
  const stX = side === 1 ? off - 2000 : off;
  let s = 1 - 2 * p;
  if (Math.abs(s) < 0.003) s = 0.003;
  const fold = `${T} translate(${off} 0) scale(${s} 1) translate(${-off} 0) rotate(${-theta}) translate(${-cx} ${-cy})`;
  const extra = o.extra || '';
  return `
    <defs>
      <clipPath id="${id}m"><rect x="${mvX}" y="-2000" width="2000" height="4000" transform="${T}"/></clipPath>
      <clipPath id="${id}s"><rect x="${stX}" y="-2000" width="2000" height="4000" transform="${T}"/></clipPath>
    </defs>
    <rect x="0" y="0" width="400" height="400" rx="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
    <g clip-path="url(#${id}s)">${o.shape(PINK)}${extra}</g>
    <g transform="${fold}"><g clip-path="url(#${id}m)">${o.shape(BLUE)}${extra}</g></g>
    <g transform="${T}"><line x1="${off}" x2="${off}" y1="-260" y2="260" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 8"/></g>
    ${o.overlay || ''}`;
}

/* ---------- 動畫：只有按鈕觸發，沒有計時器自動重置 ---------- */
let raf = null;
function stopAnim() { if (raf) cancelAnimationFrame(raf); raf = null; }
function animateFold(st) {
  stopAnim();
  const from = st.p, to = from >= 0.5 ? 0 : 1;
  const t0 = performance.now(), dur = 1200 * Math.abs(to - from) + 80;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    st.p = from + (to - from) * e;
    render();
    raf = k < 1 ? requestAnimationFrame(step) : null;
  };
  raf = requestAnimationFrame(step);
}
const foldLabel = st => (st.p >= 0.5 ? '攤開' : '對摺');
function setSlider(el, v) { if (+el.value !== v) el.value = v; }

/* ---------- 任務一 ---------- */
function render1() {
  const st = state.t1, sh = SHAPES[st.shape];
  $('#svg1').innerHTML = scene({
    id: 'a', cx: sh.cx, cy: sh.cy, theta: st.theta, off: st.off, side: st.side, p: st.p,
    shape: c => shapeMarkup(sh, c)
  });
  $('#v1theta').textContent = st.theta + '°';
  setSlider($('#r1theta'), st.theta);
  setSlider($('#r1off'), st.off);
  setSlider($('#r1p'), Math.round(st.p * 100));
  $('#b1fold').textContent = foldLabel(st);
  document.querySelectorAll('#shapeChips .chip').forEach((b, i) => b.classList.toggle('on', i === st.shape));
}

/* ---------- 任務二 ---------- */
function geom() {
  const st = state.t2, fig = FIGS[st.fig];
  const pts = fig.pts[st.dir].map(([id, x, y]) => ({ id, x, y }));
  const edges = pts.map((a, i) => {
    const b = pts[(i + 1) % pts.length];
    return { id: a.id + b.id, a, b };
  });
  return { cx: fig.cx, cy: fig.cy, theta: st.dir === 'v' ? 0 : 90, pts, edges };
}
function toLocal(P, g) {
  const r = g.theta * Math.PI / 180, dx = P.x - g.cx, dy = P.y - g.cy;
  return { x: dx * Math.cos(r) + dy * Math.sin(r), y: -dx * Math.sin(r) + dy * Math.cos(r) };
}
function fromLocal(L, g) {
  const r = g.theta * Math.PI / 180;
  return { x: g.cx + L.x * Math.cos(r) - L.y * Math.sin(r), y: g.cy + L.x * Math.sin(r) + L.y * Math.cos(r) };
}
function dispPoint(P, g, st) {
  const l = toLocal(P, g);
  if (st.side * l.x > 0.001) l.x *= (1 - 2 * st.p);
  return fromLocal(l, g);
}
function reflect(P, g) { const l = toLocal(P, g); return fromLocal({ x: -l.x, y: l.y }, g); }
const near = (a, b) => Math.abs(a.x - b.x) < 1.5 && Math.abs(a.y - b.y) < 1.5;
function outward(P, g, len) {
  let vx = P.x - g.cx, vy = P.y - g.cy; const m = Math.hypot(vx, vy) || 1;
  return { x: vx / m * len, y: vy / m * len };
}

function render2() {
  const st = state.t2, g = geom(), fig = FIGS[st.fig];
  const path = 'M ' + g.pts.map(p => p.x + ' ' + p.y).join(' L ') + ' Z';
  const sh = { d: path };

  let extra = '', overlay = '';
  if (st.mode === 'edges') {
    extra = g.edges.filter(e => st.marked.has(e.id)).map(e =>
      `<line x1="${e.a.x}" y1="${e.a.y}" x2="${e.b.x}" y2="${e.b.y}" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>`).join('');
    overlay = g.edges.map(e => {
      const a = dispPoint(e.a, g, st), b = dispPoint(e.b, g, st);
      const mid = dispPoint({ x: (e.a.x + e.b.x) / 2, y: (e.a.y + e.b.y) / 2 }, g, st);
      const o = outward({ x: (e.a.x + e.b.x) / 2, y: (e.a.y + e.b.y) / 2 }, g, 28);
      return `<g class="hit" data-id="${e.id}">
        <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="30" stroke-linecap="round"/>
        <text x="${mid.x + o.x}" y="${mid.y + o.y}" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#374151" pointer-events="none">${e.id}邊</text></g>`;
    }).join('');
  } else {
    overlay = [...g.pts].sort((a, b) => st.marked.has(a.id) - st.marked.has(b.id)).map(P => {
      const d = dispPoint(P, g, st), o = outward(P, g, 30), on = st.marked.has(P.id);
      return `<g class="hit" data-id="${P.id}">
        <circle cx="${d.x}" cy="${d.y}" r="24" fill="transparent"/>
        <circle cx="${d.x}" cy="${d.y}" r="12" fill="${on ? '#f59e0b' : '#fff'}" stroke="${on ? '#b45309' : '#4b5563'}" stroke-width="4"/>
        <text x="${d.x + o.x}" y="${d.y + o.y}" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700" fill="#374151" pointer-events="none">${P.id}</text></g>`;
    }).join('');
  }

  $('#svg2').innerHTML = scene({
    id: 'b', cx: g.cx, cy: g.cy, theta: g.theta, off: 0, side: st.side, p: st.p,
    shape: c => shapeMarkup(sh, c), extra, overlay
  });

  setSlider($('#r2p'), Math.round(st.p * 100));
  $('#b2fold').textContent = foldLabel(st);
  document.querySelectorAll('#figChips .chip').forEach((b, i) => b.classList.toggle('on', i === st.fig));
  document.querySelectorAll('#dirChips .chip').forEach(b => b.classList.toggle('on', b.dataset.v === st.dir));
  document.querySelectorAll('#modeChips .chip').forEach(b => b.classList.toggle('on', b.dataset.v === st.mode));
  $('#out2').innerHTML = report(g);
}

function report(g) {
  const st = state.t2;
  if (st.marked.size === 0) return '<div>先點一下圖上的點（或邊）做記號。</div>';
  if (st.p < 0.999) return '<div>按「對摺」，或拉動「摺起來的程度」，看看標記的地方會跑到哪裡。</div>';
  const lines = [];
  if (st.mode === 'points') {
    g.pts.filter(P => st.marked.has(P.id)).forEach(P => {
      if (Math.abs(toLocal(P, g).x) < 0.5) { lines.push(`${P.id}：剛好在摺痕上，摺的時候沒有移動。`); return; }
      const q = g.pts.find(Q => near(Q, reflect(P, g)));
      lines.push(q ? `${P.id} 和 ${q.id} 疊在一起了。` : `${P.id} 沒有和圖上任何一個點疊在一起。`);
    });
  } else {
    g.edges.filter(e => st.marked.has(e.id)).forEach(e => {
      const ra = reflect(e.a, g), rb = reflect(e.b, g);
      const q = g.edges.find(f => (near(f.a, ra) && near(f.b, rb)) || (near(f.a, rb) && near(f.b, ra)));
      lines.push(q ? `${e.id}邊 和 ${q.id}邊 疊在一起了。` : `${e.id}邊 沒有和圖上任何一條邊完全疊在一起。`);
    });
  }
  return lines.map(l => `<div>${l}</div>`).join('');
}

function render() { state.tab === 1 ? render1() : render2(); }

/* ---------- 建立按鈕與事件 ---------- */
function chips(box, items, onPick) {
  box.innerHTML = '';
  items.forEach(([label, val], i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.dataset.v = val;
    b.onclick = () => { stopAnim(); onPick(val, i); render(); };
    box.appendChild(b);
  });
}

chips($('#shapeChips'), SHAPES.map((s, i) => [s.name, i]), (v, i) => {
  Object.assign(state.t1, { shape: i, theta: 0, off: 0, side: 1, p: 0 });
});
chips($('#figChips'), FIGS.map((f, i) => [f.name, i]), (v, i) => {
  Object.assign(state.t2, { fig: i, side: 1, p: 0 }); state.t2.marked.clear();
});
chips($('#dirChips'), [['左右對摺（直的摺痕）', 'v'], ['上下對摺（橫的摺痕）', 'h']], v => {
  Object.assign(state.t2, { dir: v, p: 0 }); state.t2.marked.clear();
});
chips($('#modeChips'), [['點', 'points'], ['邊', 'edges']], v => {
  Object.assign(state.t2, { mode: v, p: 0 }); state.t2.marked.clear();
});

// 任務一：改變摺痕時，紙先攤開，避免畫面亂跳
$('#r1theta').oninput = e => { stopAnim(); Object.assign(state.t1, { theta: +e.target.value, p: 0 }); render(); };
$('#r1off').oninput = e => { stopAnim(); Object.assign(state.t1, { off: +e.target.value, p: 0 }); render(); };
$('#r1p').oninput = e => { stopAnim(); state.t1.p = e.target.value / 100; render(); };
$('#b1fold').onclick = () => animateFold(state.t1);
$('#b1side').onclick = () => { stopAnim(); state.t1.side *= -1; state.t1.p = 0; render(); };
$('#b1reset').onclick = () => { stopAnim(); Object.assign(state.t1, { theta: 0, off: 0, side: 1, p: 0 }); render(); };

// 任務二
$('#r2p').oninput = e => { stopAnim(); state.t2.p = e.target.value / 100; render(); };
$('#b2fold').onclick = () => animateFold(state.t2);
$('#b2side').onclick = () => { stopAnim(); state.t2.side *= -1; state.t2.p = 0; render(); };
$('#b2clear').onclick = () => { state.t2.marked.clear(); render(); };
$('#svg2').addEventListener('click', e => {
  const t = e.target.closest('[data-id]');
  if (!t) return;
  const m = state.t2.marked, id = t.dataset.id;
  m.has(id) ? m.delete(id) : m.add(id);
  render();
});

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  stopAnim();
  state.tab = +b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('#p1').hidden = state.tab !== 1;
  $('#p2').hidden = state.tab !== 2;
  render();
});

render();
</script>
</body>
</html>
